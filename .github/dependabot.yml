version: 2

# The root module has no third-party dependencies and a test that enforces
# it, so it is deliberately not listed. It was, once, "for the toolchain" --
# and with go.work in the tree dependabot read the workspace from the root,
# bumped the submodules' dependencies a second time from there, and raised
# the root's `go` directive to whatever the new dependency wanted. That is
# the one change CONTRIBUTING says must never happen by accident, and it
# broke the 1.25 leg of CI three times on the morning it was tried. Raising
# the floor is a decision, made in a minor release with a changelog entry.
updates:
  - package-ecosystem: gomod
    directory: /apidoc
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(apidoc)"
    groups:
      # go-openapi moves as a family behind swaggo; separate PRs for each of
      # its dozen modules would be noise that nobody reads.
      openapi:
        patterns:
          - "github.com/go-openapi/*"
          - "github.com/pb33f/*"
          - "github.com/swaggo/*"

  - package-ecosystem: gomod
    directory: /lightfeed
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(lightfeed)"
    groups:
      # cdproto tracks the Chrome DevTools Protocol and chromedp tracks
      # cdproto; updating one without the other is how the pair breaks.
      chromedp:
        patterns:
          - "github.com/chromedp/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
