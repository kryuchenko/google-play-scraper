name: Canary (live Google Play contract)

# Live contract tests against the real Google Play. They assert concrete fields
# on freshly fetched data, so a red run signals that Google changed its page
# layout or RPC shape and a specific parse path broke — not a code regression in
# this repo. A weekly cadence is enough to catch drift without hammering Google
# (and risking rate-limit bans), plus manual dispatch for on-demand checks.

on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Read-only: unlike the main Tests workflow, this never commits anything.
permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    # Generous ceiling: the suite is throttled (1s between requests) and
    # sequential, and CategoryApps issues a bounded burst of requests.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable

      # A failing subtest writes the responses it saw (URL, status, headers,
      # the first 4 KB of each body, when) to GPSCRAPE_EVIDENCE_DIR, so a red
      # run that does not reproduce still leaves something to read.
      - name: Run canary contract tests
        env:
          GPSCRAPE_EVIDENCE_DIR: ${{ runner.temp }}/canary-evidence
        run: go test -tags canary -run TestCanary -v -timeout 15m ./...

      - name: Upload evidence from failed subtests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: canary-evidence
          path: ${{ runner.temp }}/canary-evidence
          if-no-files-found: ignore
          retention-days: 14
