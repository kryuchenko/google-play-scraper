name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.24', '1.25', 'stable']

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      # -short keeps CI deterministic: it skips the live-network tests (which
      # hit play.google.com and flake on Google's jitter / rate limits) and
      # runs the offline, fixture-backed suite. Live drift detection lives in
      # the scheduled canary workflow instead.
      - name: Run tests with coverage
        run: go test -short -v -race -coverprofile=coverage.out -covermode=atomic ./...

      # The OpenAPI spec for Google's endpoints lives in the isolated apidoc
      # submodule (keeps the root zero-dependency), so the root test run above
      # never enters it. Run its drift tests here on the stable leg: they fail
      # if a new rpcid/path is undocumented or the committed spec is stale.
      - name: Verify API docs (apidoc submodule)
        if: matrix.go-version == 'stable'
        working-directory: apidoc
        run: go test ./...

      # Gate the OpenAPI spec on the two standard linters so a future change
      # cannot reintroduce a deprecation/lint warning unnoticed (the Go drift
      # test only guards the schema `example` keyword). Versions are pinned for
      # reproducibility; configs (redocly.yaml, .spectral.yaml) are auto-found.
      - name: Setup Node (spec linters)
        if: matrix.go-version == 'stable'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint OpenAPI spec (Redocly + Spectral)
        if: matrix.go-version == 'stable'
        working-directory: apidoc
        run: |
          npx --yes @redocly/cli@2.32.2 lint docs/swagger.yaml
          npx --yes @stoplight/spectral-cli@6.16.0 lint --fail-severity=warn docs/swagger.yaml

      - name: Update coverage in README
        if: github.ref == 'refs/heads/main' && matrix.go-version == 'stable'
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          sed -i "s/coverage-[0-9.]*%25/coverage-${COVERAGE}%25/" README.md
          echo "Coverage: $COVERAGE%"

      - name: Commit coverage badge
        if: github.ref == 'refs/heads/main' && matrix.go-version == 'stable'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git diff --quiet README.md || (git add README.md && git commit -m "Update coverage badge" && git push)
