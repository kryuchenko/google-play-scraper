name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default. The one job that writes -- the coverage badge push --
# asks for contents: write itself. Everything else here runs third-party
# tools (golangci-lint, govulncheck, two npx linters), and none of them should
# hold a token that can push to this repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25', 'stable']

    # A committed go.work (see CONTRIBUTING) would pull apidoc and lightfeed
    # into every `./...` below; both require go 1.27 and would break the 1.25
    # leg. The root module is checked in module mode — exactly how a consumer
    # who runs `go get` resolves it.
    env:
      GOWORK: 'off'

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      # Config lives in .golangci.yml and carries no exclusions: everything the
      # default set reported was either fixed or made explicit at the call
      # site. Pinned so a new release cannot turn a green branch red on its own.
      - name: Lint
        if: matrix.go-version == 'stable'
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1 run --timeout 10m ./...

      # -short keeps CI deterministic: it skips the live-network tests (which
      # hit play.google.com and flake on Google's jitter / rate limits) and
      # runs the offline, fixture-backed suite. Live drift detection lives in
      # the scheduled canary workflow instead.
      - name: Run tests with coverage
        run: go test -short -v -race -coverprofile=coverage.out -covermode=atomic ./...

      # The OpenAPI spec for Google's endpoints lives in the isolated apidoc
      # submodule (keeps the root zero-dependency), so the root test run above
      # never enters it. Run its drift tests here on the stable leg: they fail
      # if a new rpcid/path is undocumented or the committed spec is stale.
      # lightfeed was previously built by no workflow at all. It needs go 1.27
      # and resolves the root module from the proxy (no workspace), which is
      # how a `go get` consumer builds it.
      - name: Build and test lightfeed submodule
        if: matrix.go-version == 'stable'
        working-directory: lightfeed
        run: |
          go build ./...
          go vet ./...
          go test ./...

      # The step above resolves the root module from the proxy, which is how a
      # consumer builds lightfeed -- but it means lightfeed is tested against
      # the last release, not against this branch. A root change that breaks it
      # would only surface after the release. The workspace supplies HEAD.
      - name: Build lightfeed against this branch
        if: matrix.go-version == 'stable'
        env:
          GOWORK: ''
        working-directory: lightfeed
        run: |
          go build ./...
          go test ./...

      # The benchmarks are run once each rather than measured: the point here
      # is that they still compile and do not panic on the fixtures. Timing in
      # CI is meaningless, and the numbers are only comparable within one
      # toolchain anyway.
      - name: Benchmarks compile and run
        if: matrix.go-version == 'stable'
        run: go test -run '^$' -bench . -benchtime 1x ./...

      # A short fuzz run per target on top of the seed corpus. Not long enough
      # to explore much, but enough that a parser which panics on the shapes
      # already in testdata/ cannot merge. Deep runs belong in a scheduled job,
      # not on the pull-request path.
      # The differential targets are listed too, and were missing. The six
      # panic-contract fuzzers only assert that a parser does not blow up; the
      # differential ones hold a hand-written scanner against the
      # implementation it replaced -- and the streaming shard scan against the
      # buffered one -- which is the check that actually catches a behaviour
      # change. They found two real divergences before release, and then ran
      # seed-corpus-only in CI, which is not fuzzing. All ten targets are
      # listed: the list once had nine, and the one missing was the
      # stream-against-buffer comparison.
      - name: Fuzz parsers briefly
        if: matrix.go-version == 'stable'
        run: |
          for target in FuzzParseAppPage FuzzParseDataBlocks FuzzBatchExecute \
                        FuzzParseReviews FuzzResultRows FuzzSitemapLoc \
                        FuzzDataBlockScanMatchesRegex FuzzShardScanMatchesXML \
                        FuzzIndexScanMatchesXML FuzzShardStreamMatchesBuffer; do
            echo "== $target"
            go test -run '^$' -fuzz "^$target$" -fuzztime 30s .
          done

      - name: Vulnerability scan
        # Pinned, and the pin has to move with the toolchain: govulncheck
        # v1.1.4 builds on golang.org/x/tools v0.29.0, whose SSA builder
        # predates Go 1.27 and panics on it -- "unexpected expr:
        # *ast.KeyValueExpr" on a composite literal inside a return. v1.7.0
        # carries x/tools v0.49.0. When `stable` moves to a Go release this
        # cannot parse, this is the line to bump.
        if: matrix.go-version == 'stable'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      # Module mode resolves the root from the proxy, i.e. the last tagged
      # release, so this is the consumer's view: does apidoc still build
      # against what is published. Its drift test cannot run here on a
      # release branch -- the committed spec describes this branch's types,
      # and the previous release's types regenerate a different one -- so the
      # tests run in the workspace pass below, against HEAD.
      - name: Build API docs against the published root (apidoc submodule)
        if: matrix.go-version == 'stable'
        working-directory: apidoc
        run: go build ./... && go vet ./...

      # As with lightfeed above: the step before this resolves the root module
      # from the proxy, so the drift test regenerated the spec from the
      # previous release's types and could not see a change made on this
      # branch. The workspace supplies HEAD, and this is the pass that fails
      # when a type changed and apidoc's `./gen.sh` was not run.
      - name: Verify API docs against this branch
        if: matrix.go-version == 'stable'
        env:
          GOWORK: ''
        working-directory: apidoc
        run: go test ./...

      # Gate the OpenAPI spec on the two standard linters so a future change
      # cannot reintroduce a deprecation/lint warning unnoticed (the Go drift
      # test only guards the schema `example` keyword). Versions are pinned for
      # reproducibility; configs (redocly.yaml, .spectral.yaml) are auto-found.
      - name: Setup Node (spec linters)
        if: matrix.go-version == 'stable'
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Lint OpenAPI spec (Redocly + Spectral)
        if: matrix.go-version == 'stable'
        working-directory: apidoc
        run: |
          npx --yes @redocly/cli@2.32.2 lint docs/swagger.yaml
          npx --yes @stoplight/spectral-cli@6.16.0 lint --fail-severity=warn docs/swagger.yaml

      # The badge job below reads this leg's profile. Uploaded only where the
      # badge is updated, so a pull request produces no artifact.
      - name: Upload coverage profile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.go-version == 'stable'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 1

  # Its own job so that contents: write is scoped to the one step that pushes
  # and to nothing that runs a third-party tool. The trigger is the one the
  # badge always had: a push to main, measured on the stable leg.
  badge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GOWORK: 'off'

    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Download coverage profile
        uses: actions/download-artifact@v8
        with:
          name: coverage

      # The badge measures the library, not the binaries around it. Two reasons:
      # examples/, internal/ and cmd/ are lightly covered by design and dilute the
      # number, and their statement counts move between Go releases far more
      # than the library's do -- on the same commit, go1.26.4 reports 74.3%
      # over the full profile and go1.27.0 reports 68.5%, purely because
      # coverage instrumentation changed. Filtering keeps the badge a signal
      # about tests rather than about the toolchain CI happens to run.
      #
      # The profile is located rather than named: download-artifact majors
      # have differed on whether a single artifact lands in the workspace root
      # or in a folder named after it.
      - name: Update coverage in README
        run: |
          profile=$(find . -maxdepth 2 -name coverage.out -type f | head -n 1)
          test -n "$profile" || { echo "no coverage.out downloaded"; exit 1; }
          grep -vE '/(examples|internal|cmd)/' "$profile" > coverage.lib.out
          COVERAGE=$(go tool cover -func=coverage.lib.out | grep total | awk '{print $3}' | tr -d '%')
          sed -i "s/coverage-[0-9.]*%25/coverage-${COVERAGE}%25/" README.md
          echo "Library coverage: $COVERAGE%"

      - name: Commit coverage badge
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git diff --quiet README.md || (git add README.md && git commit -m "Update coverage badge" && git push)
