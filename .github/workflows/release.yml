name: Release

# Builds gpscrape for the usual platforms and attaches the binaries to the
# release. The command is stdlib-only with no cgo, so cross-compilation is a
# matter of setting GOOS and GOARCH -- no toolchain matrix, no containers.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # Pinned to stable rather than the module's floor: the binaries
          # should carry the newest runtime and allocator, which is where most
          # of this release's performance comes from. The floor governs what
          # library consumers may compile with, not what we ship.
          go-version: stable

      - name: Build
        env:
          GOWORK: 'off'
          CGO_ENABLED: '0'
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${platform%/*}"
            arch="${platform#*/}"
            out="dist/gpscrape_${tag}_${os}_${arch}"
            [ "$os" = windows ] && out="$out.exe"
            echo "building $out"
            # -trimpath so the binaries do not embed the runner's paths, and
            # the version is stamped rather than guessed at runtime.
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$tag" \
              -o "$out" ./cmd/gpscrape
          done
          cd dist && sha256sum * > checksums.txt && cat checksums.txt

      # The release body is the changelog entry, not a list of commits.
      # --generate-notes would produce a one-line summary of a squashed
      # release commit, which says nothing a reader wants; CHANGELOG.md is
      # where the release is actually described. Fall back to generated notes
      # only if the version has no section, which would itself be a mistake
      # worth noticing.
      - name: Extract release notes from the changelog
        run: |
          tag="${{ github.ref_name }}"
          awk -v v="${tag#v}" '
            $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ -s /tmp/notes.md ]; then
            echo "notes: $(wc -l < /tmp/notes.md) lines from CHANGELOG.md"
          else
            echo "::warning::no CHANGELOG section for $tag; falling back to generated notes"
          fi

      # Pushing a tag does not create a Release, so uploading to one that does
      # not exist fails -- and this workflow runs for the first time at the
      # exact moment a release is being cut. Create it if absent, then upload.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            if [ -s /tmp/notes.md ]; then
              gh release create "$tag" --title "$tag" --notes-file /tmp/notes.md
            else
              gh release create "$tag" --title "$tag" --generate-notes
            fi
          fi
          gh release upload "$tag" dist/* --clobber

      - name: Upload as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gpscrape-binaries
          path: dist/
