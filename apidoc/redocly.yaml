# Lint config for the reverse-engineered Google Play spec.
#
# These are Google's private, UNAUTHENTICATED web endpoints — the scraper sends
# no API key, OAuth token or cookie (verified empirically). There is therefore
# no security scheme to declare, so the recommended `security-defined` rule does
# not apply here. Everything else uses Redocly's recommended ruleset.
extends:
  - recommended
rules:
  # Quoted: bare `off` is YAML boolean false, which newer Redocly does not
  # accept as a severity; the string "off" is the correct disable value.
  security-defined: "off"
