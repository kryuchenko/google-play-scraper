components:
  schemas:
    apidoc.App:
      properties:
        IAPRange:
          description: |-
            IAPRange is the human-readable in-app-purchase price range; absent when the
            app has no IAP.
          example: $0.99 - $149.99 per item
          type: string
        adSupported:
          description: AdSupported is true when the listing declares "Contains ads".
          example: true
          type: boolean
        androidVersion:
          description: |-
            AndroidVersion is the minimum supported Android version; may be empty when
            Google reports "Varies with device".
          example: "6.0"
          type: string
        appId:
          description: AppID is the app package name (the listing's id query parameter).
          example: com.google.android.apps.maps
          type: string
        available:
          description: |-
            Available is true when the listing was reachable and parsed (a 404/region
            block yields false).
          example: true
          type: boolean
        categories:
          description: Categories is the list of category names the app is filed under.
          items:
            type: string
          type: array
          uniqueItems: false
        contentRating:
          description: |-
            ContentRating is the age/content rating label, e.g. "Everyone" or
            "USK: Ages 18+".
          example: Everyone
          type: string
        contentRatingDescription:
          description: |-
            ContentRatingDescription is the qualifier shown next to ContentRating
            (e.g. "Gambling with Cash Payouts"); may be absent.
          example: Gambling with Cash Payouts
          type: string
        currency:
          description: Currency is the ISO 4217 code for Price/OriginalPrice, e.g.
            "USD", "EUR".
          example: USD
          type: string
        description:
          description: |-
            Description is the long description with HTML stripped to plain text;
            newlines are preserved.
          type: string
        descriptionHTML:
          description: |-
            DescriptionHTML is the long description with Google's original inline
            markup preserved (mostly <br> tags and HTML entities).
          type: string
        developer:
          description: Developer is the developer's display name.
          example: Google LLC
          type: string
        developerAddress:
          description: DeveloperAddress is the developer's postal address; may be
            empty.
          type: string
        developerEmail:
          description: DeveloperEmail is the developer's contact email; may be empty.
          example: apps-help@google.com
          format: email
          type: string
        developerId:
          description: |-
            DeveloperID is the developer listing id used by GET /store/apps/developer
            (a numeric id or a quoted name).
          example: Google LLC
          type: string
        developerInternalID:
          description: |-
            DeveloperInternalID is Google's internal developer id; present only for EU
            DSA trader listings.
          type: string
        developerLegalAddress:
          description: DeveloperLegalAddress is the trader's registered address (EU
            DSA only).
          type: string
        developerLegalEmail:
          description: DeveloperLegalEmail is the trader's legal contact email (EU
            DSA only).
          format: email
          type: string
        developerLegalName:
          description: DeveloperLegalName is the trader's registered legal name (EU
            DSA only).
          type: string
        developerLegalPhoneNumber:
          description: DeveloperLegalPhoneNumber is the trader's contact phone number
            (EU DSA only).
          type: string
        developerWebsite:
          description: DeveloperWebsite is the developer's website URL; may be empty.
          example: http://maps.google.com/about/
          format: uri
          type: string
        discountEndDate:
          description: |-
            DiscountEndDate is the discount expiry as a Unix epoch in SECONDS; present
            only while a discount is active, otherwise 0/absent.
          example: 1735689600
          format: int64
          minimum: 0
          type: integer
        earlyAccessEnabled:
          description: EarlyAccessEnabled is true when the listing is in early-access
            state.
          example: false
          type: boolean
        free:
          description: Free is true when Price == 0.
          example: true
          type: boolean
        genre:
          description: Genre is the localized primary category name.
          example: Travel & Local
          type: string
        genreId:
          description: |-
            GenreID is the stable, uppercased category id (a Play category enum value).
            See the categories list for the full set; "GAME_*" prefixes a game genre.
          example: TRAVEL_AND_LOCAL
          type: string
        headerImage:
          description: HeaderImage is the feature-graphic banner URL; absent on some
            listings.
          example: https://play-lh.googleusercontent.com/UVo1hFs93u3MCQMQo6_KoKrX
          format: uri
          type: string
        histogram:
          description: |-
            Histogram is the rating-count breakdown by star level, indexed
            [0]=1-star .. [4]=5-star. Values are counts, not percentages, and need not
            sum exactly to Ratings.
          example:
          - 5452870
          - 1679546
          - 461292
          - 1082704
          - 9500000
          items:
            type: integer
          type: array
          uniqueItems: false
        icon:
          description: Icon is the app icon URL.
          example: https://play-lh.googleusercontent.com/B8pdO_2K5nBsF0g1h6dKwV
          format: uri
          type: string
        installs:
          description: |-
            Installs is the human-formatted install count with grouping separators and
            a trailing "+", exactly as displayed.
          example: 1,000,000,000+
          type: string
        isAvailableInPlayPass:
          description: IsAvailableInPlayPass is true when the app is included in Google
            Play Pass.
          example: false
          type: boolean
        maxInstalls:
          description: |-
            MaxInstalls is Google's estimated actual install count (an upper bound,
            strictly >= MinInstalls).
          example: 2263522953
          format: int64
          minimum: 0
          type: integer
        minInstalls:
          description: MinInstalls is the lower bound of the install bucket as an
            integer.
          example: 1000000000
          format: int64
          minimum: 0
          type: integer
        offersIAP:
          description: |-
            OffersIAP is true when the listing offers in-app purchases (derived from
            the presence of IAPRange).
          example: true
          type: boolean
        originalPrice:
          description: |-
            OriginalPrice is the pre-discount price in major currency units (micros
            divided down); present only while a promotional discount is active.
          example: 9.99
          minimum: 0
          type: number
        preregister:
          description: Preregister is true for an unreleased app open for pre-registration.
          example: false
          type: boolean
        previewVideo:
          description: PreviewVideo is the autoplay mp4 preview clip URL; absent when
            there is none.
          format: uri
          type: string
        price:
          description: |-
            Price is the purchase price in major currency units (already divided down
            from Google's micros). 0 for free apps; see Currency for the unit.
          example: 0
          minimum: 0
          type: number
        priceText:
          description: PriceText is the formatted price label (e.g. "$4.99"); empty
            for free apps.
          example: ""
          type: string
        privacyPolicy:
          description: PrivacyPolicy is the developer's privacy-policy URL; may be
            absent.
          example: http://www.google.com/policies/privacy
          format: uri
          type: string
        ratings:
          description: Ratings is the total number of star ratings.
          example: 19445897
          minimum: 0
          type: integer
        recentChanges:
          description: RecentChanges is the latest "What's new" changelog text; may
            be absent.
          type: string
        released:
          description: |-
            Released is the original release date as a Unix epoch in SECONDS, e.g.
            1352989068 (= 2012-11-15). 0 when absent. Symmetric with Updated.
          example: 1352989068
          format: int64
          minimum: 0
          type: integer
        reviews:
          description: Reviews is the number of written text reviews (a subset of
            Ratings).
          example: 677911
          minimum: 0
          type: integer
        score:
          description: |-
            Score is the average star rating, a float in [0,5] at full precision
            (ScoreText holds the rounded one-decimal label Google displays).
          example: 4.626984
          maximum: 5
          minimum: 0
          type: number
        scoreText:
          description: |-
            ScoreText is the rounded, one-decimal rating label as displayed, e.g.
            "4.6"; empty when the app has no rating.
          example: "4.6"
          type: string
        screenshots:
          description: Screenshots is the list of screenshot image URLs.
          items:
            type: string
          type: array
          uniqueItems: false
        summary:
          description: |-
            Summary is the short tagline shown under the title. It may contain HTML
            entities exactly as Google serves them (e.g. "&amp;").
          example: Real-time GPS navigation &amp; local suggestions
          type: string
        title:
          description: Title is the localized app name.
          example: Google Maps
          type: string
        updated:
          description: Updated is the last-updated time as a Unix epoch in SECONDS.
            0 when absent.
          example: 1779963225
          format: int64
          minimum: 0
          type: integer
        url:
          description: URL is the canonical Play Store listing URL.
          example: https://play.google.com/store/apps/details?id=com.king.candycrushsaga
          format: uri
          type: string
        version:
          description: |-
            Version is the current version string; may be empty when Google reports
            "Varies with device".
          example: 1.329.0.1
          type: string
        video:
          description: Video is the YouTube trailer player URL; absent on most non-game
            listings.
          format: uri
          type: string
        videoImage:
          description: VideoImage is the trailer poster image URL; absent when there
            is no trailer.
          format: uri
          type: string
      type: object
    apidoc.AvailabilityResult:
      properties:
        appId:
          description: AppID is the probed app.
          example: com.google.android.apps.maps
          type: string
        checked:
          description: |-
            Checked is the number of countries that produced a conclusive status
            (anything other than StatusFetchError).
          example: 242
          minimum: 0
          type: integer
        errors:
          additionalProperties:
            type: string
          description: |-
            Errors maps a country to the underlying error, populated only for
            StatusFetchError outcomes. It is nil when no probe errored. Serialized as a
            country-to-message map.
          type: object
        globallyRemoved:
          description: |-
            GloballyRemoved is true only when at least one country was conclusively
            probed and every conclusive (non-error) probe returned StatusNotFound —
            i.e. the app appears to have no listing anywhere it was checked. It is only
            meaningful on a full AllCountries sweep; on a narrow Countries set it
            merely reflects that subset. Note that AllCountries excludes markets
            without an official Play Store (cn/ir/kp/sy), so "globally" means across
            the Play markets, not literally every country.
          example: false
          type: boolean
        statuses:
          additionalProperties:
            $ref: '#/components/schemas/googleplayscraper.Status'
          description: |-
            Statuses maps each probed gl country code to its Status. Countries that
            were never reached (e.g. due to context cancellation) are absent.
          type: object
      type: object
    apidoc.DataSafety:
      properties:
        collectedData:
          description: CollectedData lists data the app collects; may be empty.
          items:
            $ref: '#/components/schemas/googleplayscraper.DataSafetyEntry'
          type: array
          uniqueItems: false
        privacyPolicyUrl:
          description: PrivacyPolicyURL is the privacy-policy URL from the data-safety
            page.
          example: http://www.google.com/policies/privacy
          format: uri
          type: string
        securityPractices:
          description: SecurityPractices lists the developer's declared security practices.
          items:
            $ref: '#/components/schemas/googleplayscraper.SecurityPractice'
          type: array
          uniqueItems: false
        sharedData:
          description: SharedData lists data the app shares with third parties; may
            be empty.
          items:
            $ref: '#/components/schemas/googleplayscraper.DataSafetyEntry'
          type: array
          uniqueItems: false
      type: object
    apidoc.ErrorResponse:
      properties:
        code:
          description: |-
            Code is the upstream HTTP status the scraper observed, copied verbatim into
            StatusError.Code. 404 = listing not found, 429 = rate-limited / anti-bot,
            5xx = upstream Google error.
          example: 404
          type: integer
        message:
          description: Message is the human-readable error string, matching StatusError.Error().
          example: 'unexpected status: 404'
          type: string
      type: object
    apidoc.Permission:
      properties:
        permission:
          description: |-
            Permission is the human-readable permission description, e.g.
            "precise location".
          example: precise location
          type: string
        type:
          description: |-
            Type is the permission group label, e.g. "Location", "Camera". Falls back
            to "Common"/"Other" when the group is unnamed.
          example: Location
          type: string
      type: object
    apidoc.ReviewsResult:
      properties:
        nextToken:
          description: |-
            NextToken is the continuation token for the next batchexecute page; empty
            when there are no more reviews.
          example: CroBIrEBAU60USc0jm2Ps4haLPoSm2pV
          type: string
        reviews:
          description: Reviews is the page of parsed reviews.
          items:
            $ref: '#/components/schemas/googleplayscraper.Review'
          type: array
          uniqueItems: false
      type: object
    apidoc.SearchResult:
      properties:
        appId:
          description: AppID is the app package name.
          example: com.king.candycrushsaga
          type: string
        currency:
          description: Currency is the ISO 4217 code for Price; often empty in compact
            results.
          example: ""
          type: string
        developer:
          description: Developer is the developer's display name.
          example: King
          type: string
        developerId:
          description: DeveloperID is the developer listing id.
          example: King
          type: string
        free:
          description: Free is true when Price == 0.
          example: true
          type: boolean
        icon:
          description: Icon is the app icon URL.
          example: https://play-lh.googleusercontent.com/...=s64
          format: uri
          type: string
        price:
          description: Price is the purchase price in major currency units; 0 for
            free apps.
          example: 0
          minimum: 0
          type: number
        score:
          description: Score is the average star rating, a float in [0,5] at full
            precision.
          example: 4.5100965
          maximum: 5
          minimum: 0
          type: number
        scoreText:
          description: ScoreText is the rounded, one-decimal rating label, e.g. "4.6".
          example: "4.5"
          type: string
        summary:
          description: Summary is the short tagline; may contain HTML entities as
            served.
          type: string
        title:
          description: Title is the localized app name.
          example: Candy Crush Saga
          type: string
        url:
          description: URL is the canonical Play Store listing URL.
          example: https://play.google.com/store/apps/details?id=com.king.candycrushsaga
          format: uri
          type: string
      type: object
    googleplayscraper.Criteria:
      properties:
        name:
          description: Name is the aspect being rated, e.g. "Gameplay" or "Graphics".
          example: Gameplay
          type: string
        rating:
          description: Rating is the aspect's star rating, an integer 1..5.
          example: 4
          maximum: 5
          minimum: 1
          type: integer
      type: object
    googleplayscraper.DataSafetyEntry:
      properties:
        data:
          description: Data is the specific data item name, e.g. "Email address".
          example: Email address
          type: string
        optional:
          description: |-
            Optional is true when collection/sharing of this item is optional
            (false = required).
          example: true
          type: boolean
        purpose:
          description: |-
            Purpose is the comma-separated list of declared purposes, e.g.
            "App functionality, Analytics".
          example: App functionality, Account management
          type: string
        type:
          description: Type is the category this item belongs to, e.g. "Personal info".
          example: Personal info
          type: string
      type: object
    googleplayscraper.Review:
      properties:
        criterias:
          description: |-
            Criterias holds per-aspect sub-ratings (e.g. gameplay, graphics); present
            mainly on games and absent on most apps.
          items:
            $ref: '#/components/schemas/googleplayscraper.Criteria'
          type: array
          uniqueItems: false
        date:
          description: |-
            Date is when the review was posted, as a timezone-aware timestamp
            (serialized RFC 3339).
          example: "2026-04-21T23:00:45.167+02:00"
          format: date-time
          type: string
        id:
          description: ID is the opaque review identifier (a UUID-like string).
          example: 8f3c1d2e-1a2b-4c5d-9e0f-112233445566
          type: string
        replyDate:
          description: |-
            ReplyDate is when the developer replied; zero/absent when there is no
            reply (serialized RFC 3339).
          format: date-time
          type: string
        replyText:
          description: ReplyText is the developer's reply body; absent when there
            is no reply.
          type: string
        score:
          description: Score is the star rating, an integer 1..5.
          example: 5
          maximum: 5
          minimum: 1
          type: integer
        text:
          description: Text is the review body.
          example: Works great, exactly what I needed.
          type: string
        thumbsUp:
          description: ThumbsUp is the count of users who found the review helpful.
          example: 16
          minimum: 0
          type: integer
        url:
          description: URL is the canonical link to the review on the Play Store.
          example: https://play.google.com/store/apps/details?id=com.example&reviewId=8f3c1d2e
          format: uri
          type: string
        userImage:
          description: UserImage is the URL of the author's avatar.
          example: https://play-lh.googleusercontent.com/a/AGNmyx...=s64
          format: uri
          type: string
        userName:
          description: UserName is the review author's display name.
          example: Jane Doe
          type: string
        version:
          description: Version is the app version the review was left on; may be absent.
          example: 26.15.01.894202351
          type: string
      type: object
    googleplayscraper.SecurityPractice:
      properties:
        description:
          description: |-
            Description is the practice detail; it may contain inline HTML (e.g. an
            anchor tag) exactly as Google serves it.
          example: Your data is transferred over a secure connection
          type: string
        practice:
          description: Practice is the practice headline, e.g. "Data is encrypted
            in transit".
          example: Data is encrypted in transit
          type: string
      type: object
    googleplayscraper.Status:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      type: integer
      x-enum-varnames:
      - StatusUnknown
      - StatusAvailable
      - StatusNotInRegion
      - StatusNotFound
      - StatusFetchError
externalDocs:
  description: google-play-scraper source
  url: https://github.com/kryuchenko/google-play-scraper
info:
  description: |-
    Reverse-engineered description of the PRIVATE, undocumented
    HTTP endpoints of the Google Play Store web frontend that the
    google-play-scraper Go library calls.

    DISCLAIMER: These endpoints are NOT a public, supported Google
    API. This project is NOT affiliated with, endorsed by, or
    sponsored by Google. The endpoints are undocumented, may change
    or disappear without notice, and accessing them may be subject
    to the Google Play / Google Terms of Service. This spec is
    provided for interoperability and educational purposes only.

    Two response shapes appear:
    * AF_initDataCallback: GET endpoints return text/html whose
    body embeds `AF_initDataCallback({key:'ds:N', data:[...]})`
    script blocks; the scraper extracts the logical model from
    a numbered data block (e.g. ds:5).
    * batchexecute envelope: POST /_/PlayStoreUi/data/batchexecute
    returns a `)]}'`-prefixed, `wrb.fr`-framed envelope; the
    scraper decodes the inner URL-encoded JSON for the RPC.
  license:
    name: MIT
    url: https://github.com/kryuchenko/google-play-scraper/blob/main/LICENSE
  title: Google Play Store private HTTP API (reverse-engineered)
  version: 1.0.0
openapi: 3.1.0
paths:
  /_/PlayStoreUi/data/batchexecute(IJ4APc):
    post:
      description: |-
        POST /_/PlayStoreUi/data/batchexecute?rpcids=IJ4APc. Returns the
        batchexecute envelope; a []string of suggested query terms is
        decoded from the inner payload.
      operationId: batchSuggestIJ4APc
      parameters:
      - description: Fixed rpcid for this operation
        in: query
        name: rpcids
        required: true
        schema:
          enum:
          - IJ4APc
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
              - type: string
              - title: f.req
                type: string
        description: URL-encoded JSON envelope [[['IJ4APc','<inner-args>']]]
        required: true
      responses:
        "200":
          content:
            text/plain:
              schema:
                items:
                  type: string
                type: array
          description: Suggested terms decoded from batchexecute envelope. An empty/null
            inner payload means no suggestions, not an error.
        "429":
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/apidoc.ErrorResponse'
          description: Rate-limited / anti-bot challenge. Google may return 429, or
            200 redirecting to google.com/sorry (CAPTCHA). Sustained scraping from
            one IP triggers this.
        "500":
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/apidoc.ErrorResponse'
          description: Upstream Google error (any 5xx). Surfaced as StatusError with
            the observed code.
        x-response-encoding: batchexecute-envelope
        x-rpcid: IJ4APc
      summary: Search suggestions RPC (IJ4APc)
      tags:
      - batchexecute-rpc
  /_/PlayStoreUi/data/batchexecute(oCPfdb):
    post:
      description: |-
        POST /_/PlayStoreUi/data/batchexecute. Unlike the other RPCs the
        scraper does NOT put rpcids in the query string; the rpcid lives
        only inside the f.req body. Handles both the initial fetch and
        pagination. Returns the batchexecute envelope; ReviewsResult
        (reviews + nextToken) is decoded from the inner payload.
      operationId: batchReviewsOCPfdb
      parameters:
      - description: 'Review sort order (Sort enum, constants.go): 1=helpfulness,
          2=newest, 3=rating. Default 2 (newest). NOTE: not a real query field — this
          value is embedded inside the f.req inner args; it is documented as a parameter
          only to surface the enum.'
        in: query
        name: sort
        schema:
          enum:
          - 1
          - 2
          - 3
          maximum: 3
          minimum: 1
          type: integer
      - description: Reviews per request; embedded in f.req, capped at 150 by Google
          (reviews.go). Documented as a parameter only to surface the limit.
        in: query
        name: count
        schema:
          maximum: 150
          minimum: 1
          type: integer
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
              - type: string
              - title: f.req
                type: string
        description: URL-encoded JSON envelope [[['oCPfdb','<inner-args>',null,'generic']]].
          The sort order, page size and pagination token all live inside the inner
          args, NOT as query fields.
        required: true
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/apidoc.ReviewsResult'
          description: Decoded from batchexecute envelope. An empty/null inner payload
            means no more reviews (end of pagination), not an error; nextToken is
            then empty.
        "429":
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/apidoc.ErrorResponse'
          description: Rate-limited / anti-bot challenge. Google may return 429, or
            200 redirecting to google.com/sorry (CAPTCHA). Sustained scraping from
            one IP triggers this.
        "500":
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/apidoc.ErrorResponse'
          description: Upstream Google error (any 5xx). Surfaced as StatusError with
            the observed code.
        x-response-encoding: batchexecute-envelope
        x-rpcid: oCPfdb
      summary: Reviews RPC (oCPfdb)
      tags:
      - batchexecute-rpc
  /_/PlayStoreUi/data/batchexecute(qnKhOb):
    post:
      description: |-
        POST /_/PlayStoreUi/data/batchexecute?rpcids=qnKhOb. Fetches a
        recommendation topic by continuation token. Returns the
        batchexecute envelope; []SearchResult plus an echo token are
        decoded from the inner payload.
        Empirical note (reverse-engineered live 2026-06-12): PAGE 1 of a
        topic IS reachable statelessly. Each "recommended for you" section
        on the category/cluster HTML page carries the topic's recs_topic
        query inside its cluster URL gsr param (a field-9 base64url
        protobuf); re-wrapped into the field-12 form this RPC expects, it
        returns the topic's apps in one request (see extractFeedTokens).
        The scraper follows every topic on the page this way. PAGE 2+ of a
        single topic is SERVER-STATEFUL: the response's own token
        ([0][3][0]) re-references the same topic and is answered with a
        200 + NULL payload on replay, and the next topic is allocated
        server-side per session and never echoed — so a single topic
        cannot be chained deeper from bare HTTP. The payload template is
        kept current so this keeps working as Google rebuilds its flags.
        Review pagination uses a different RPC (oCPfdb).
      operationId: batchPaginateQnKhOb
      parameters:
      - description: Fixed rpcid for this operation
        in: query
        name: rpcids
        required: true
        schema:
          enum:
          - qnKhOb
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
              - type: string
              - title: f.req
                type: string
        description: URL-encoded JSON carrying the continuation token
        required: true
      responses:
        "200":
          content:
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/apidoc.SearchResult'
                type: array
          description: Decoded from batchexecute envelope; includes next token. When
