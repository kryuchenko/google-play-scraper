  /store/apps/details(availability):
    get:
      description: |-
        Reuses GET /store/apps/details per gl country. Availability is
        derived from node [18] of `ds:5`[1][2]: [18][0]==2 available,
        ==1 pre-registration, empty/missing not-in-region, HTTP 404
        not-found. The aggregated sweep yields AvailabilityResult.
      operationId: getAppAvailability
      parameters:
      - description: App package id, reverse-domain form (pattern ^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$,
          descriptive only), e.g. com.whatsapp
        in: query
        name: id
        required: true
        schema:
          maxLength: 255
          minLength: 3
          type: string
      - description: UI language, ISO 639-1, e.g. en
        in: query
        name: hl
        schema:
          maxLength: 5
          minLength: 2
          type: string
      - description: Country to probe, ISO 3166-1 alpha-2 lowercase (pattern ^[a-z]{2}$,
          descriptive only); one request per country, e.g. us
        in: query
        name: gl
        required: true
        schema:
          maxLength: 2
          minLength: 2
          type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/apidoc.AvailabilityResult'
          description: Aggregated availability sweep; per-country Status read from
            ds:5[1][2][18]
        "404":
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/apidoc.ErrorResponse'
          description: Probed country has no listing; at the per-country probe a 404
            maps to Status not_found (StatusError{Code:404}) rather than failing the
            whole sweep.
        "429":
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/apidoc.ErrorResponse'
          description: Rate-limited / anti-bot challenge. Google may return 429, or
            200 redirecting to google.com/sorry (CAPTCHA). Sweeping many countries
            from one IP makes this likely; the failing country maps to Status error.
        "500":
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/apidoc.ErrorResponse'
          description: Upstream Google error (any 5xx); the failing country maps to
            Status error.
        x-data-block: ds:5
        x-payload-node: '[1][2][18]'
        x-response-encoding: AF_initDataCallback
        x-rpcid: none
      summary: App availability probe (HTML, ds:5 node [18])
      tags:
      - html-endpoints
